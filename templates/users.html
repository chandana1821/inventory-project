<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">E-Commerce Admin</div>
            <ul class="nav-menu">
                <li><a href="/">Dashboard</a></li>
                <li><a href="/users" class="active">Users</a></li>
                <li><a href="/products">Products</a></li>
                <li><a href="/orders">Orders</a></li>
                <li><a href="/logs">Activity Logs</a></li>
            </ul>
        </div>
    </nav>
    
    <div class="container">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2>User Management</h2>
                <button class="btn btn-primary" onclick="Modal.open('userModal')">Add New User</button>
            </div>
            
            <table id="users-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Admin</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Users will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- User Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="Modal.close('userModal')">&times;</span>
            <h2 id="modalTitle">Add New User</h2>
            <form id="userForm" onsubmit="saveUser(event)">
                <input type="hidden" id="userId">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" class="form-control" id="fullName" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="form-group">
                    <label for="isAdmin">
                        <input type="checkbox" id="isAdmin"> Is Admin
                    </label>
                </div>
                <button type="submit" class="btn btn-success">Save</button>
                <button type="button" class="btn btn-danger" onclick="Modal.close('userModal')">Cancel</button>
            </form>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        let editingUserId = null;
        
        async function loadUsers() {
            try {
                const users = await API.getUsers();
                const tableBody = document.querySelector('#users-table tbody');
                tableBody.innerHTML = users.map(user => `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.username}</td>
                        <td>${user.full_name}</td>
                        <td>${user.email}</td>
                        <td>${user.is_admin ? 'Yes' : 'No'}</td>
                        <td>${formatDate(user.created_at)}</td>
                        <td>
                            <button class="btn btn-primary btn-sm" onclick="editUser(${user.id})">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteUser(${user.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showAlert('Error loading users: ' + error.message, 'error');
            }
        }
        
        async function saveUser(event) {
            event.preventDefault();
            
            const userData = {
                username: document.getElementById('username').value,
                full_name: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                is_admin: document.getElementById('isAdmin').checked
            };
            
            try {
                if (editingUserId) {
                    await API.updateUser(editingUserId, userData);
                    showAlert('User updated successfully');
                } else {
                    await API.createUser(userData);
                    showAlert('User created successfully');
                }
                
                Modal.close('userModal');
                loadUsers();
                resetForm();
            } catch (error) {
                showAlert('Error saving user: ' + error.message, 'error');
            }
        }
        
        async function editUser(id) {
            try {
                const user = await API.getUser(id);
                editingUserId = user.id;
                document.getElementById('userId').value = user.id;
                document.getElementById('username').value = user.username;
                document.getElementById('fullName').value = user.full_name;
                document.getElementById('email').value = user.email;
                document.getElementById('isAdmin').checked = user.is_admin;
                document.getElementById('modalTitle').textContent = 'Edit User';
                Modal.open('userModal');
            } catch (error) {
                showAlert('Error loading user: ' + error.message, 'error');
            }
        }
        
        async function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                try {
                    await API.deleteUser(id);
                    showAlert('User deleted successfully');
                    loadUsers();
                } catch (error) {
                    showAlert('Error deleting user: ' + error.message, 'error');
                }
            }
        }
        
        function resetForm() {
            editingUserId = null;
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('modalTitle').textContent = 'Add New User';
        }
        
        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
