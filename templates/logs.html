<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Logs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">E-Commerce Admin</div>
            <ul class="nav-menu">
                <li><a href="/">Dashboard</a></li>
                <li><a href="/users">Users</a></li>
                <li><a href="/products">Products</a></li>
                <li><a href="/orders">Orders</a></li>
                <li><a href="/logs" class="active">Activity Logs</a></li>
            </ul>
        </div>
    </nav>
    
    <div class="container">
        <h1>Activity Logs</h1>
        
        <div class="filter-section">
            <input type="date" id="startDate" placeholder="Start Date">
            <input type="date" id="endDate" placeholder="End Date">
            <select id="actionFilter">
                <option value="">All Actions</option>
                <option value="USER_CREATE">User Create</option>
                <option value="USER_UPDATE">User Update</option>
                <option value="USER_DELETE">User Delete</option>
                <option value="PRODUCT_CREATE">Product Create</option>
                <option value="PRODUCT_UPDATE">Product Update</option>
                <option value="PRODUCT_DELETE">Product Delete</option>
                <option value="ORDER_CREATE">Order Create</option>
                <option value="ORDER_VIEW">Order View</option>
                <option value="INVENTORY_UPDATE">Inventory Update</option>
            </select>
            <input type="number" id="userId" placeholder="User ID">
            <button class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
            <button class="btn btn-danger" onclick="clearFilters()">Clear</button>
        </div>
        
        <div class="card">
            <table id="logs-table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>User ID</th>
                        <th>Action</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Logs will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        let currentFilters = {};
        
        async function loadLogs() {
            try {
                const logs = await API.getLogs(currentFilters);
                const tableBody = document.querySelector('#logs-table tbody');
                
                if (logs.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No logs found</td></tr>';
                } else {
                    tableBody.innerHTML = logs.map(log => `
                        <tr>
                            <td>${formatDate(log.timestamp)}</td>
                            <td>${log.user_id || 'System'}</td>
                            <td>
                                <span style="
                                    background-color: ${getActionColor(log.action)};
                                    color: white;
                                    padding: 0.25rem 0.5rem;
                                    border-radius: 4px;
                                    font-size: 0.85rem;
                                ">
                                    ${log.action}
                                </span>
                            </td>
                            <td>${log.details}</td>
                        </tr>
                    `).join('');
                }
            } catch (error) {
                showAlert('Error loading logs: ' + error.message, 'error');
            }
        }
        
        function getActionColor(action) {
            const colors = {
                'USER_CREATE': '#10b981',
                'USER_UPDATE': '#f59e0b',
                'USER_DELETE': '#ef4444',
                'PRODUCT_CREATE': '#10b981',
                'PRODUCT_UPDATE': '#f59e0b',
                'PRODUCT_DELETE': '#ef4444',
                'ORDER_CREATE': '#8b5cf6',
                'ORDER_VIEW': '#6366f1',
                'INVENTORY_UPDATE': '#ec4899'
            };
            return colors[action] || '#6b7280';
        }
        
        function applyFilters() {
            currentFilters = {
                start_date: document.getElementById('startDate').value,
                end_date: document.getElementById('endDate').value,
                action: document.getElementById('actionFilter').value,
                user_id: document.getElementById('userId').value
            };
            
            // Remove empty filters
            Object.keys(currentFilters).forEach(key => {
                if (!currentFilters[key]) {
                    delete currentFilters[key];
                }
            });
            
            loadLogs();
        }
        
        function clearFilters() {
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            document.getElementById('actionFilter').value = '';
            document.getElementById('userId').value = '';
            currentFilters = {};
            loadLogs();
        }
        
        // Auto-refresh logs every 30 seconds
        setInterval(loadLogs, 30000);
        
        document.addEventListener('DOMContentLoaded', loadLogs);
    </script>
</body>
</html>
